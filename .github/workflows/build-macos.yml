name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build MacClean Uninstaller
        run: |
          xcodebuild \
            -project MacCleanUninstaller.xcodeproj \
            -scheme MacCleanUninstaller \
            -configuration Debug \
            -derivedDataPath build \
            -sdk macosx \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacCleanUninstaller-macOS
          path: build/Build/Products/Debug/MacCleanUninstaller.app
          if-no-files-found: warn
