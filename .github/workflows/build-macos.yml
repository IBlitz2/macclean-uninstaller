name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build MacClean Uninstaller for Intel
        run: |
          xcodebuild \
            -project MacCleanUninstaller.xcodeproj \
            -scheme MacCleanUninstaller \
            -configuration Debug \
            -derivedDataPath build \
            -sdk macosx \
            -destination 'platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Intel architecture
        run: |
          lipo -info build/Build/Products/Debug/MacCleanUninstaller.app/Contents/MacOS/MacCleanUninstaller

      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MacCleanUninstaller-macOS-Intel
          path: build/Build/Products/Debug/MacCleanUninstaller.app
          if-no-files-found: error
